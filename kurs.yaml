# Kursbeschreibung – Exkurs Vollkostenrechnung (Montelli GmbH)
# Aufbau und alle Felder: referenzen/schema.md im Lernpfad-Baukasten
titel: Exkurs Vollkostenrechnung
kurzname: exkurs-vollkostenrechnung
ueberschrift: Von der GuV zum Verkaufspreis – Vollkostenrechnung bei der Montelli GmbH
untertitel: Du lernst, wie aus den Zahlen der GuV Kostenarten, ein Betriebsabrechnungsbogen und am Ende der Verkaufspreis des Rucksacks „Business Deluxe“ entstehen.
badges: [BGW24a · BRC, Montelli GmbH, 3 Stufen + Übungen]
fusszeile: Exkurs Vollkostenrechnung · BGW24a · Stand 11/2026
logo_zeichen: "€"
einleitung: |
  :::notiz 👉 Bevor du startest
  1. Du arbeitest an der **Montelli GmbH** (Taschenhersteller in Bremen). Wir rechnen mit dem Geschäftsbereich **Outdoor** (Rucksäcke).
  2. Arbeite die Module der Reihe nach durch. Rechne **mit der Hand** auf den Arbeitsblättern (docx zum Ausdrucken). Wer mag, nutzt die Excel-Vorlage.
  3. Am Ende jeder Stufe gibst du einen **Meilenstein** ab (als **PDF** oder **Word-Datei**, keine Bilder).
  4. Module mit „(H)“ im Titel eignen sich als Hausaufgabe.
  :::

stufen:
  - id: von-guv-zu-kosten
    name: Von der GuV zu den Kosten
    icon: "🌱"
    text: Aufwand und Kosten unterscheiden, Einzel- und Gemeinkosten trennen, Kostenarten gliedern und den Weg zu den Kostenstellen finden.
    module: [g1, g2, gm]
  - id: bab
    name: Der Betriebsabrechnungsbogen
    icon: "🚀"
    text: Kostenstellen kennenlernen, Gemeinkosten verteilen und umlegen, Kalkulationssätze berechnen und den BAB auswerten.
    module: [b1, b2, b3, b4, b5, b6]
  - id: kostentraeger
    name: Von den Kosten zum Verkaufspreis
    icon: "🏆"
    text: Ist- und Normalsätze verstehen, die Zuschlagskalkulation durchführen und den Listenverkaufspreis berechnen.
    module: [t1, t2, t3, tm]
  - id: uebungen
    name: Übungen und Vertiefung (freiwillig)
    icon: "⭐"
    text: Zusätzliche BABs der Produktionen Leder, Textil und Kunststoffe, den Maschinenstundensatz herleiten und Aussagen zum BAB prüfen.
    module: [u1, u2, u3, u4, u5, u6]

# Einstufungstests bewusst nicht verwendet: jede Stufe öffnet nur nach der Abgabe des Meilensteins davor.
# Bauen deshalb mit  python3 werkzeuge/bauen_ohne_einstufung.py <baukasten>

moodle:
  version: 4                 # BBZ-Moodle 4.5.12+ (keine Unterabschnitte, kein H5P)
  freischaltung: einstufung  # Stufe frei nach Abgabe des Meilensteins (Einstufungstests abgeschaltet, siehe oben)
  reihenfolge: nacheinander

tests:
  - id: test-abschluss
    titel: "Lernerfolgskontrolle: Von der GuV zum Verkaufspreis"
    stufe: kostentraeger     # ans Ende der letzten Stufe
    fragen: abschluss
    punkte: 10
    bestehen: 60
    versuche: 0
    feedback: nachher
    text: Zehn Fragen zu allen drei Stufen. Die Rechenaufgaben haben bei jedem Versuch andere Zahlen. Du kannst den Test wiederholen.

  - id: test-ubung-bab
    titel: "Test: Richtig oder falsch zum BAB"
    stufe: uebungen
    fragen: ubung-bab
    punkte: 10
    bestehen: 60
    versuche: 0
    feedback: sofort
    text: Acht Aussagen zum BAB und zu den Kalkulationssätzen. Du kannst den Test beliebig oft wiederholen.
