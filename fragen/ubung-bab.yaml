# Test zum BAB (Übungsbereich): richtig oder falsch, automatisch bewertet
- id: ub-01
  typ: single_choice
  niveau: 1
  review: freigegeben
  aufgabe: "Richtig oder falsch? Mit dem BAB werden die Einzelkosten je Kostenstelle ermittelt."
  optionen:
    - {text: "richtig", korrekt: false}
    - {text: "falsch", korrekt: true}
  erklaerung: "Der BAB verteilt die Gemeinkosten auf die Kostenstellen. Einzelkosten werden den Produkten direkt zugerechnet."

- id: ub-02
  typ: single_choice
  niveau: 1
  review: freigegeben
  aufgabe: "Richtig oder falsch? Gemeinkosten werden stets mit einem Verteilungsschlüssel auf die Kostenstellen verteilt."
  optionen:
    - {text: "richtig", korrekt: false}
    - {text: "falsch", korrekt: true}
  erklaerung: "Lässt sich ein Betrag über einen Beleg eindeutig zuordnen, wird er direkt verteilt. Nur gemeinsame Kosten brauchen einen Schlüssel."

- id: ub-03
